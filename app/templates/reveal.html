{% extends "base.html" %}

{% block content %}
<p class="secret-notice-text">You have received a secure secret.</p>
<p>This secret will self-destruct immediately after viewing.</p>

<form action="{{ url_for('reveal_secret', uuid=uuid) }}" method="post" id="revealForm">
    <input type="hidden" name="key" id="keyInput">
    <button type="submit">Reveal Secret</button>
</form>

<script>
    // Extract key from URL fragment
    const hash = window.location.hash;
    if (hash) {
        const key = hash.substring(1);
        document.getElementById('keyInput').value = key;
    }

    // Make the entire card clickable to reveal the secret
    const card = document.querySelector('.card');
    card.classList.add('clickable-card');
    card.addEventListener('click', function (e) {
        // Don't double-submit if user clicked the button itself
        if (e.target.closest('button')) return;
        document.getElementById('revealForm').submit();
    });
</script>
{% endblock %}
